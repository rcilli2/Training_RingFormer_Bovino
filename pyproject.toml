[project]
name = "bovino-full-reproduction"
version = "0.1.0"
description = "Portable MiniTransformer reproduction for BOVINO borehole sequence labelling."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "sentence-transformers>=3.0,<6",
    "torch>=2.5,<3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
